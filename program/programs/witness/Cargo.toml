[package]
name = "witness"
version = "0.1.0"
description = "Witness: writes a file's hash to the chain exactly once"
edition = "2021"
# Solana platform-tools v1.48 compiler (rustc 1.84). Cargo's MSRV-aware resolver
# automatically skips dependencies that need edition2024 (rustc 1.85+).
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "witness"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
