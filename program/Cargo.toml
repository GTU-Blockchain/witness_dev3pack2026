[workspace]
members = ["programs/*"]
# resolver "2": the Anchor CLI's manifest reader doesn't know "3". Good versions were
# already resolved into Cargo.lock with the MSRV-aware resolver (see programs/witness
# rust-version); the lockfile is committed, so the build uses those versions.
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
