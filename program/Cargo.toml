[workspace]
members = ["programs/*"]
# resolver "2": Anchor CLI'ın manifest okuyucusu "3"ü tanımıyor. İyi sürümler
# Cargo.lock'a MSRV-farkında çözümle (bkz. programs/witness rust-version) zaten
# yazıldı; lockfile commit'li olduğu için build o sürümleri kullanır.
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
