name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit

  app:
    name: app (typecheck + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # `npm run lint` is `expo lint --fix`; CI checks without rewriting files.
      - run: npx expo lint

  program:
    name: program (anchor build)
    runs-on: ubuntu-latest
    env:
      SOLANA_VERSION: 2.1.0
      ANCHOR_VERSION: 0.31.1
    defaults:
      run:
        working-directory: program
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana/install
            ~/.cargo/registry
            ~/.cargo/git
            program/target
          key: program-${{ runner.os }}-solana${{ env.SOLANA_VERSION }}-${{ hashFiles('program/Cargo.lock') }}
          restore-keys: program-${{ runner.os }}-solana${{ env.SOLANA_VERSION }}-
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Anchor CLI
        run: npm install -g @coral-xyz/anchor-cli@${ANCHOR_VERSION}
      - run: solana --version && anchor --version
      - run: anchor build
